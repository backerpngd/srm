<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SR Mastery">
<script>try{var s=(JSON.parse(localStorage.getItem('srm.v1')).settings||{}).theme||'dark',d=s==='dark'||(s==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<style>html{background:#3b82f6}</style>
<title>Self Regulation Mastery</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="splash"><img src="icon-512.png" alt="Self Regulation Mastery"></div>

<main id="welcome" hidden>
  <div class="band">
    <header class="wtop"><div data-lang-seg></div><div data-theme-seg></div></header>
    <div class="hero">
      <img src="icon-512.png" alt="" class="logo">
      <h1>Self Regulation Mastery</h1>
      <span class="kicker" data-i="kicker"></span>
      <p class="tagline" data-i="tagline"></p>
    </div>
  </div>
  <section class="pbox" aria-labelledby="lgH">
    <div class="lhd"><h2 id="lgH" data-i="login"></h2><p data-i="loginSub"></p></div>
    <div class="lhd lhd0"><h2 data-i="wlc"></h2><p data-i="wlcSub"></p></div>
    <div id="plist"></div>
    <button class="btn add wide" data-a="cp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i="createProfile"></span></button>
    <div id="cpForm" class="reveal"><div>
      <div class="form">
        <label class="lbl" for="pname" data-i="pname"></label>
        <input id="pname" class="inp" maxlength="24" autocomplete="off" data-ip="pname">
        <label class="lbl" for="pgender" data-i="gender"></label>
        <select id="pgender" class="inp"><option value="" data-i="choose"></option><option value="male" data-i="male"></option><option value="female" data-i="female"></option></select>
        <p id="cpErr" class="err" role="alert"></p>
        <button class="btn pri wide" data-a="create" data-i="create"></button>
        <button class="btn ghost wide" data-a="cpCancel" data-i="cancel"></button>
      </div>
    </div></div>
    <button class="btn guide wide" data-a="guide"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17h.01"/></svg><span data-i="guide"></span></button>
    <p class="site"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3"/></svg><span>srmastery.com</span></p>
  </section>
</main>

<div id="app" hidden>
  <header class="hd"><span class="hic" id="hI" aria-hidden="true"></span><div class="hx"><h1 id="hT"></h1><p id="hS"></p></div></header>
  <section id="view"></section>
  <nav id="nav" aria-label="Main"></nav>
</div>

<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<input type="file" id="impF" accept=".json,application/json" hidden>
<div id="print" aria-hidden="true"></div>
<script src="js/app.js"></script>
</body>
</html>
